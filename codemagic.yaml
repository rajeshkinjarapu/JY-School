workflows:
  teacher-app-android-workflow:
    name: Teacher App Android Build
    max_build_duration: 30
    environment:
      groups:
        - shorebird
      flutter: stable
    working_directory: flutter_workspace
    scripts:
      - name: Install Shorebird
        script: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash
          export PATH="$HOME/.shorebird/bin:$PATH"
      - name: Install Melos
        script: dart pub global activate melos
      - name: Bootstrap Workspace
        script: dart pub global run melos bootstrap
      - name: Build Teacher App APK with Shorebird
        script: |
          export PATH="$HOME/.shorebird/bin:$PATH"
          cd apps/teacher_app
          shorebird patch android --no-confirm
    artifacts:
      - apps/teacher_app/build/app/outputs/flutter-apk/app-release.apk

