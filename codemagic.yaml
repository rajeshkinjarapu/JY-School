workflows:
  teacher-release-workflow:
    name: Teacher App Release (APK)
    max_build_duration: 30
    environment:
      groups:
        - shorebird
      flutter: stable
    working_directory: flutter_mobile
    scripts:
      - name: Install Shorebird
        script: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash
          export PATH="$HOME/.shorebird/bin:$PATH"
      - name: Build Teacher Release
        script: |
          yes | sdkmanager --install "ndk;28.2.13676358"
          export PATH="$HOME/.shorebird/bin:$PATH"
          flutter clean
          shorebird release android --flavor teacher -t lib/main_teacher.dart --artifact apk --no-confirm
    artifacts:
      - flutter_mobile/build/app/outputs/flutter-apk/app-teacher-release.apk

  teacher-patch-workflow:
