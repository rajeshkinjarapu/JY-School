workflows:
  teacher-release-workflow:
    name: Teacher App Release (APK)
    max_build_duration: 30
    environment:
      groups:
        - shorebird
      flutter: stable
    working_directory: flutter_workspace/apps/teacher_app
    scripts:
      - name: Install Shorebird
        script: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash
          export PATH="$HOME/.shorebird/bin:$PATH"
      - name: Build Teacher Release
        script: |
          export PATH="$HOME/.shorebird/bin:$PATH"
          flutter clean
          shorebird release android --artifact apk --no-confirm
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab

  teacher-patch-workflow:
    name: Teacher App Patch (Update)
    max_build_duration: 30
    environment:
      groups:
        - shorebird
      flutter: stable
    working_directory: flutter_workspace/apps/teacher_app
    scripts:
      - name: Install Shorebird
        script: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash
          export PATH="$HOME/.shorebird/bin:$PATH"
      - name: Build Teacher Patch
        script: |
          export PATH="$HOME/.shorebird/bin:$PATH"
          flutter clean
          shorebird patch android --no-confirm

