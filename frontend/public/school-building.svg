<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="brickGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="350" fill="url(#skyGrad)"/>

  <!-- Soft Clouds -->
  <ellipse cx="120" cy="60" rx="70" ry="25" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="160" cy="50" rx="50" ry="20" fill="#ffffff" opacity="0.7"/>
  <ellipse cx="650" cy="70" rx="90" ry="28" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="700" cy="60" rx="60" ry="22" fill="#ffffff" opacity="0.7"/>

  <!-- Distant Trees -->
  <path d="M0 260 Q 200 240 400 255 Q 600 240 800 255 L 800 350 L 0 350 Z" fill="#15803d" opacity="0.7"/>

  <!-- Main School Building Complex -->
  <!-- Left Wing -->
  <rect x="60" y="110" width="220" height="150" fill="url(#wallGrad)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="55" y="100" width="230" height="14" fill="url(#brickGrad)"/>
  <rect x="50" y="90" width="240" height="12" fill="url(#roofGrad)"/>

  <!-- Left Wing Windows (3 rows of 5) -->
  <g fill="url(#glassGrad)" stroke="#ffffff" stroke-width="2">
    <!-- Row 1 -->
    <rect x="75" y="125" width="28" height="30" rx="3"/>
    <rect x="115" y="125" width="28" height="30" rx="3"/>
    <rect x="155" y="125" width="28" height="30" rx="3"/>
    <rect x="195" y="125" width="28" height="30" rx="3"/>
    <rect x="235" y="125" width="28" height="30" rx="3"/>
    <!-- Row 2 -->
    <rect x="75" y="165" width="28" height="30" rx="3"/>
    <rect x="115" y="165" width="28" height="30" rx="3"/>
    <rect x="155" y="165" width="28" height="30" rx="3"/>
    <rect x="195" y="165" width="28" height="30" rx="3"/>
    <rect x="235" y="165" width="28" height="30" rx="3"/>
    <!-- Row 3 -->
    <rect x="75" y="205" width="28" height="30" rx="3"/>
    <rect x="115" y="205" width="28" height="30" rx="3"/>
    <rect x="155" y="205" width="28" height="30" rx="3"/>
    <rect x="195" y="205" width="28" height="30" rx="3"/>
    <rect x="235" y="205" width="28" height="30" rx="3"/>
  </g>

  <!-- Right Wing -->
  <rect x="520" y="110" width="220" height="150" fill="url(#wallGrad)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="515" y="100" width="230" height="14" fill="url(#brickGrad)"/>
  <rect x="510" y="90" width="240" height="12" fill="url(#roofGrad)"/>

  <!-- Right Wing Windows (3 rows of 5) -->
  <g fill="url(#glassGrad)" stroke="#ffffff" stroke-width="2">
    <!-- Row 1 -->
    <rect x="535" y="125" width="28" height="30" rx="3"/>
    <rect x="575" y="125" width="28" height="30" rx="3"/>
    <rect x="615" y="125" width="28" height="30" rx="3"/>
    <rect x="655" y="125" width="28" height="30" rx="3"/>
    <rect x="695" y="125" width="28" height="30" rx="3"/>
    <!-- Row 2 -->
    <rect x="535" y="165" width="28" height="30" rx="3"/>
    <rect x="575" y="165" width="28" height="30" rx="3"/>
    <rect x="615" y="165" width="28" height="30" rx="3"/>
    <rect x="655" y="165" width="28" height="30" rx="3"/>
    <rect x="695" y="165" width="28" height="30" rx="3"/>
    <!-- Row 3 -->
    <rect x="535" y="205" width="28" height="30" rx="3"/>
    <rect x="575" y="205" width="28" height="30" rx="3"/>
    <rect x="615" y="205" width="28" height="30" rx="3"/>
    <rect x="655" y="205" width="28" height="30" rx="3"/>
    <rect x="695" y="205" width="28" height="30" rx="3"/>
  </g>

  <!-- Central Grand Building / Admin Block -->
  <rect x="270" y="75" width="260" height="185" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="260,75 400,25 540,75" fill="url(#roofGrad)"/>
  <rect x="265" y="70" width="270" height="12" fill="url(#brickGrad)"/>

  <!-- Clock / Emblem Tower in Center Pediment -->
  <circle cx="400" cy="55" r="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <line x1="400" y1="55" x2="400" y2="47" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="400" y1="55" x2="407" y2="55" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

  <!-- Central Block Windows & Balcony -->
  <g fill="url(#glassGrad)" stroke="#ffffff" stroke-width="2">
    <rect x="295" y="95" width="32" height="35" rx="3"/>
    <rect x="345" y="95" width="32" height="35" rx="3"/>
    <rect x="423" y="95" width="32" height="35" rx="3"/>
    <rect x="473" y="95" width="32" height="35" rx="3"/>

    <rect x="295" y="145" width="32" height="35" rx="3"/>
    <rect x="345" y="145" width="32" height="35" rx="3"/>
    <rect x="423" y="145" width="32" height="35" rx="3"/>
    <rect x="473" y="145" width="32" height="35" rx="3"/>
  </g>

  <!-- Grand Pillars / Entrance Portal -->
  <rect x="385" y="90" width="30" height="170" fill="#e2e8f0" stroke="#cbd5e1"/>
  <rect x="335" y="195" width="130" height="65" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <g fill="#0284c7">
    <path d="M 375 220 A 25 25 0 0 1 425 220 L 425 260 L 375 260 Z" />
  </g>
  <!-- Classical Pillars -->
  <rect x="345" y="195" width="10" height="65" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="365" y="195" width="10" height="65" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="425" y="195" width="10" height="65" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="445" y="195" width="10" height="65" fill="#f8fafc" stroke="#94a3b8"/>

  <!-- Steps -->
  <rect x="325" y="258" width="150" height="6" fill="#cbd5e1"/>
  <rect x="315" y="264" width="170" height="6" fill="#94a3b8"/>

  <!-- Landscaped Green Lawn in Foreground -->
  <rect x="0" y="268" width="800" height="82" fill="url(#groundGrad)"/>
  <path d="M 0 270 Q 200 262 400 270 Q 600 262 800 270 L 800 350 L 0 350 Z" fill="#16a34a"/>

  <!-- Ornamental Front Garden Trees & Shrubs -->
  <g fill="url(#treeGrad)">
    <circle cx="35" cy="270" r="30"/>
    <circle cx="55" cy="265" r="24"/>
    <circle cx="745" cy="270" r="30"/>
    <circle cx="765" cy="265" r="24"/>
    <circle cx="280" cy="272" r="22"/>
    <circle cx="520" cy="272" r="22"/>
    <circle cx="200" cy="275" r="18"/>
    <circle cx="600" cy="275" r="18"/>
  </g>
  
  <!-- Flower beds -->
  <ellipse cx="400" cy="285" rx="120" ry="8" fill="#f59e0b" opacity="0.6"/>
  <ellipse cx="400" cy="283" rx="100" ry="6" fill="#ef4444" opacity="0.7"/>
</svg>

