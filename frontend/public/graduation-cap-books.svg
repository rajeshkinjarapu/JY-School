<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="100%" height="100%">
  <defs>
    <!-- Shadow filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="bookBottomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="bookTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tasselGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <g filter="url(#softGlow)">
    <!-- Bottom Book (Orange/Gold) -->
    <!-- Spine & Base -->
    <path d="M 25 110 L 95 128 L 135 112 L 65 96 Z" fill="#c2410c" />
    <path d="M 25 110 L 25 120 L 95 138 L 95 128 Z" fill="#9a3412" />
    <!-- Pages side -->
    <path d="M 95 128 L 95 138 L 135 122 L 135 112 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5"/>
    <!-- Top cover -->
    <path d="M 24 108 L 94 126 L 136 110 L 66 94 Z" fill="url(#bookBottomGrad)" />

    <!-- Top Book (Blue) -->
    <!-- Pages side -->
    <path d="M 35 96 L 98 112 L 130 99 L 68 85 Z" fill="#0369a1" />
    <path d="M 35 96 L 35 104 L 98 120 L 98 112 Z" fill="#075985" />
    <path d="M 98 112 L 98 120 L 130 107 L 130 99 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.5"/>
    <path d="M 33 94 L 97 110 L 131 97 L 67 83 Z" fill="url(#bookTopGrad)" />

    <!-- Rolled Diploma Scroll in front -->
    <g transform="translate(10, 112) rotate(-8)">
      <rect x="0" y="0" width="46" height="12" rx="6" fill="url(#scrollGrad)" stroke="#cbd5e1" stroke-width="0.7"/>
      <!-- Ribbon -->
      <rect x="18" y="-1" width="8" height="14" rx="2" fill="#ef4444"/>
      <!-- Ribbon tails -->
      <path d="M 20 13 L 17 21 L 22 19 L 26 21 L 24 13 Z" fill="#dc2626"/>
    </g>

    <!-- Graduation Cap Skull base -->
    <ellipse cx="80" cy="58" rx="28" ry="14" fill="#0f172a" />
    <path d="M 52 58 Q 80 82 108 58 L 108 66 Q 80 90 52 66 Z" fill="#1e293b" />

    <!-- Graduation Mortarboard Diamond Top -->
    <path d="M 80 18 L 142 46 L 80 74 L 18 46 Z" fill="url(#capGrad)" stroke="#475569" stroke-width="1"/>
    
    <!-- Top highlight line -->
    <path d="M 80 20 L 138 46 L 80 72" fill="none" stroke="#64748b" stroke-width="1" opacity="0.6"/>

    <!-- Center Button -->
    <ellipse cx="80" cy="46" rx="4.5" ry="3.5" fill="url(#tasselGrad)" stroke="#854d0e" stroke-width="0.5"/>

    <!-- Golden Tassel Ribbon -->
    <path d="M 80 46 C 96 46, 122 52, 126 72" fill="none" stroke="url(#tasselGrad)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Tassel Brush/Fringe -->
    <g transform="translate(126, 72)">
      <!-- Ring cap -->
      <ellipse cx="0" cy="0" rx="2.5" ry="1.5" fill="#ca8a04"/>
      <!-- Brush body -->
      <path d="M -3 1 C -4 8, -5 18, -4 24 L 4 24 C 5 18, 4 8, 3 1 Z" fill="url(#tasselGrad)"/>
      <!-- Brush fringe lines -->
      <line x1="-2" y1="24" x2="-2" y2="28" stroke="#ca8a04" stroke-width="1"/>
      <line x1="0" y1="24" x2="0" y2="28" stroke="#ca8a04" stroke-width="1"/>
      <line x1="2" y1="24" x2="2" y2="28" stroke="#ca8a04" stroke-width="1"/>
    </g>
  </g>
</svg>

