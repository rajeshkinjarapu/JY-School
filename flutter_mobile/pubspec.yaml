name: jy_school_flutter
description: A new Flutter mobile application for JY School ERP.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons and style
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # API & Utilities
  http: ^1.2.0
  shared_preferences: ^2.2.2
  jwt_decoder: ^2.0.1
  flutter_local_notifications: ^17.1.2
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - shorebird.yaml
    - assets/images/logo.png
