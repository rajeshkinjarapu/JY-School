name: jy_school_flutter
description: A new Flutter mobile application for JY School ERP.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons and style
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # API & Utilities
  http: ^1.2.0
  shared_preferences: ^2.2.2
  jwt_decoder: ^2.0.1
  flutter_local_notifications: ^17.1.2
  url_launcher: ^6.2.5
  fl_chart: ^0.68.0
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0
  image_picker: ^1.1.2
  intl: ^0.20.3
  pdf: ^3.13.0
  printing: ^5.15.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.0
  uuid: ^4.5.1
  path_provider: ^2.1.6
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.jpg"

flutter:
  uses-material-design: true
  assets:
    - shorebird.yaml
    - assets/images/logo.png
    - assets/images/app_icon.jpg
